name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Decode signing keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk PrivateDnsTiles.apk

      # Replace the rolling "latest" release so both the tag and the APK
      # always point at the newest commit on main.
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest PrivateDnsTiles.apk \
            --target "$GITHUB_SHA" \
            --title "Private DNS Tiles $VERSION" \
            --notes "Download: https://github.com/${{ github.repository }}/releases/download/latest/PrivateDnsTiles.apk

          After installing, grant the permission once via ADB:
          \`adb shell pm grant com.ilhanyurek.privatednstiles android.permission.WRITE_SECURE_SETTINGS\`"

      # Drop runs for commits that are no longer on main (e.g. after a rebase).
      - name: Prune stale workflow runs
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --limit 500 --json databaseId,headSha,status \
            --jq '.[] | select(.status=="completed") | "\(.databaseId) \(.headSha)"' |
          while read -r id sha; do
            git merge-base --is-ancestor "$sha" HEAD 2>/dev/null || gh run delete "$id"
          done
