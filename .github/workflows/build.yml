name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PrivateDnsTiles.apk

      # Keep the zipped artifact too (handy for PRs / older runs)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivateDnsTiles-apk
          path: PrivateDnsTiles.apk
          if-no-files-found: error

      # Publish the raw .apk to a "latest" release for a direct, un-zipped download
      - name: Publish to latest release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Direct APK download (no zip):
            https://github.com/${{ github.repository }}/releases/download/latest/PrivateDnsTiles.apk

            Built from ${{ github.sha }}.

            After installing, grant the DNS permission once via ADB:
            `adb shell pm grant com.ilhanyurek.privatednstiles android.permission.WRITE_SECURE_SETTINGS`
          files: PrivateDnsTiles.apk
          make_latest: "true"
